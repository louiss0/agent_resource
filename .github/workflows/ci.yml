name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: agent_resource.exe
          - os: macos-latest
            artifact: agent_resource
          - os: ubuntu-latest
            artifact: agent_resource
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2
      - name: Verify committed dependency resolution
        run: dart pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib bin test
      - name: Analyze
        run: dart analyze
      - name: Run native domain, command, and production tests
        run: dart test
      - name: Build the production executable
        shell: bash
        run: |
          mkdir -p build
          dart compile exe bin/agent_resource.dart -o build/${{ matrix.artifact }}
      - name: Smoke the built executable
        shell: bash
        run: ./build/${{ matrix.artifact }} --help
      - name: Run built-production release workflows and retain sanitized evidence
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            dart run test/support/release_gate.dart build/${{ matrix.artifact }} build/release-evidence.json --require-qualified
          else
            dart run test/support/release_gate.dart build/${{ matrix.artifact }} build/release-evidence.json
          fi
      - name: Upload sanitized native release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ runner.os }}
          path: build/release-evidence.json
          if-no-files-found: error

  release-decision:
    if: github.event_name == 'workflow_dispatch'
    needs: native-lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2
      - name: Verify committed dependency resolution
        run: dart pub get --enforce-lockfile
      - name: Download all native evidence bundles
        uses: actions/download-artifact@v4
        with:
          path: evidence
      - name: Decide integrated native release qualification
        run: dart run test/support/release_decision.dart build/release-decision.json evidence/release-evidence-Windows/release-evidence.json evidence/release-evidence-macOS/release-evidence.json evidence/release-evidence-Linux/release-evidence.json
      - name: Upload integrated release decision
        uses: actions/upload-artifact@v4
        with:
          name: release-decision
          path: build/release-decision.json
          if-no-files-found: error
