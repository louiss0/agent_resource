name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: agent_resource.exe
          - os: macos-latest
            artifact: agent_resource
          - os: ubuntu-latest
            artifact: agent_resource
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2
      - name: Verify committed dependency resolution
        run: dart pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib bin test
      - name: Analyze
        run: dart analyze
      - name: Run native domain, command, and production tests
        run: dart test
      - name: Build the production executable
        shell: bash
        run: |
          mkdir -p build
          dart compile exe bin/agent_resource.dart -o build/${{ matrix.artifact }}
      - name: Smoke the built executable
        shell: bash
        run: ./build/${{ matrix.artifact }} --help
