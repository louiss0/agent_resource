name: agent_resource
description: Manage resources consumed by AI coding harnesses.
environment:
  sdk: ^3.13.2
dependencies:
  archive: 4.0.7
  clix: 1.2.0+agent-resource.1
  crypto: ^3.0.7
  ffi: ^2.2.0
  mamba: any
  path: any
  toml: ^0.18.0
  yaml: ^3.1.4
dev_dependencies:
  lints: any
  test: any

dependency_overrides:
  # Worktree-pinned Clix fixes for EOF, cancellation and terminal restoration.
  # See third_party/clix/AGENT_RESOURCE_PATCH.md; the pub cache is untouched.
  clix:
    path: third_party/clix
